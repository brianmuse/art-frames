name: Pages
# Publishes the project website in site/ to GitHub Pages. It runs when a push to main changes
# site/ or the images it shows (site/images links to docs/images), and when someone starts it
# by hand. There is no build step: the files are published as they are. This includes the committed
# 3D hero build in site/vendor/ (rebuild it from site/hero-room/ when the room changes).
# It deploys only from main: a run started by hand on another branch skips the job.
# Pages works only after the repository is public and Pages is set to "GitHub Actions"
# (Settings → Pages → Source).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The action packs files with tar --dereference, so the site/images link becomes real files.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
