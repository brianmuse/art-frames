[project]
name = "art-frames"
version = "0.1.0"
description = "Your website, on your screen."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Flask>=3.1,<4", "waitress>=3,<4", "pydantic>=2.10,<3",
  "Pillow>=11,<13", "samsungtvws>=3,<4", "tzdata>=2025.2",
  "aioesphomeapi>=46.12,<47", "zeroconf>=0.151,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
renderer = ["playwright==1.64.1"]
static-renderer = ["weasyprint==70.0", "pypdfium2==5.14.0"]

[project.scripts]
art-frames = "art_frames.__main__:main"
dayframe = "art_frames.__main__:main"  # old name, kept for one release

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art_frames"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Docker runs on Linux: use a current cryptography there. aioesphomeapi caps it below 49 only on Intel macOS.
constraint-dependencies = ["cryptography>=50; sys_platform == 'linux'"]
